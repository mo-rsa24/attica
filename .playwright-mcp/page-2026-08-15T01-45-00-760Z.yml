    - generic [ref=f1e209]:
      - heading "Why this is the argument and not a bug report" [level=3] [ref=f1e210]
      - paragraph [ref=f1e211]: Every multi-step form has to decide where a half-finished answer lives. Keep it in the component and the code is simpler, the form is faster, and you validate the whole thing once at the end. Push it to the server on every step and you pay a request per screen and you can never validate the whole thing, because there is no moment when you have it all.
      - paragraph [ref=f1e212]: "Attica made that choice one way, and then had to make its publish step lenient enough to cope. That trade is what the rest of this scene is about: how the machine works, and what it costs."
