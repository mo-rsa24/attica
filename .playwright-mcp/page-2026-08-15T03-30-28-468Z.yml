      - heading "Two overlap queries, both run before either insert" [level=4] [ref=f5e226]
      - paragraph [ref=f5e227]: Without a lock, both transactions ask whether anything overlaps and both are told no, because neither has written yet. On SQLite there is no exclusion constraint to refuse the second INSERT, so both succeed. No exception is raised anywhere, so _record_conflict_incident is never reached and the incident table stays empty.
