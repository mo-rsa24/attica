      - paragraph [ref=f3e29]: "Nothing exists yet. Two people cannot exchange anything, so start with the only part that is not optional: making a message durable."
      - heading "One endpoint that writes a row" [level=3] [ref=f3e30]
      - paragraph [ref=f3e31]: A plain DRF view. It checks that you belong in the room, writes, and returns the row. No sockets, no Redis, no real-time anything. This is the entire foundation and it never changes again for the rest of the build.
      - generic [ref=f3e32]:
        - generic [ref=f3e33]: chat/views.py
        - code [ref=f3e37]: "class ChatMessageListCreateView(APIView): permission_classes = [IsAuthenticated] def get(self, request, room_id): room = get_object_or_404(ChatRoom, id=room_id) if request.user not in [room.organizer, room.vendor]: return Response({\"detail\": \"Forbidden\"}, status=403) messages = room.messages.order_by('created_at') return Response(MessageSerializer(messages, many=True).data) def post(self, request, room_id): room = get_object_or_404(ChatRoom, id=room_id) if request.user not in [room.organizer, room.vendor]: return Response({\"detail\": \"Forbidden\"}, status=403) payload = request.data.copy() payload['room'] = room.id payload['sender'] = request.user.id serializer = MessageSerializer(data=payload) serializer.is_valid(raise_exception=True) message = serializer.save() return Response(MessageSerializer(message).data, status=201)"
