    - generic [ref=f2e149]:
      - heading "The query is not wrong. It is just answering a question about the past." [level=3] [ref=f2e150]
      - paragraph [ref=f2e151]:
        - code [ref=f2e152]: WHERE start_at < :end AND end_at > :start
        - text: "is a correct overlap test. The problem is when it runs: both transactions ask it before either has written anything, so both get the same true answer, and both act on it."
      - paragraph [ref=f2e153]: Two fixes are available and they are not the same fix. Serialize the readers so only one can be between the question and the answer at a time. Or give the database a rule it can enforce without being asked. Attica does both, in that order, and records which one caught each collision.
      - paragraph [ref=f2e154]: "It also does a third thing that neither fix gives you: it turns availability into rows with a counter, so a resource that can take five bookings at once can say so. An overlap query has no way to express five."
